<script>
const API=(m,u,b)=>{const tk=localStorage.getItem('token');const o={method:m,headers:{'Authorization':tk?`Bearer ${tk}`:''}};if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)};return fetch(u,o).then(r=>r.json().then(d=>{if(!r.ok){if(r.status===401){localStorage.removeItem('token');location.reload()}throw new Error(d.error||'ط®ط·ط£')}return d}))}
const apiGet=u=>API('GET',u),apiPost=(u,b)=>API('POST',u,b),apiPut=(u,b)=>API('PUT',u,b),apiDel=u=>API('DELETE',u)
let currentUser=null,currentPage='dashboard',chartInst={}
const ROLES={'OWNER':{icon:'ًں‘‘',level:0},'ADMIN':{icon:'ًں›،ï¸ڈ',level:1},'MODERATOR':{icon:'âڑ،',level:2},'VIP':{icon:'â­گ',level:3},'MEMBER':{icon:'ًں‘¤',level:4},'GUEST':{icon:'ًں”°',level:5}}

function jwtPayload(t){try{const p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')))}catch{return null}}

function checkAuth(){
  const tk=localStorage.getItem('token')
  if(tk){const p=jwtPayload(tk);if(p&&p.exp>Date.now()/1000){currentUser={...p,token:tk};apiGet('/api/me').then(u=>{currentUser.role=u.role;showApp()}).catch(()=>{checkAuth()});return}}

}
async function login(){
  const u=document.getElementById('li-user').value.trim(),pw=document.getElementById('li-pass').value
  if(!u||!pw)return err('ط£ط¯ط®ظ„ ط¨ظٹط§ظ†ط§طھ ط§ظ„ط¯ط®ظˆظ„')
  try{const d=await apiPost('/api/login',{username:u,password:pw});localStorage.setItem('token',d.token);const p=jwtPayload(d.token);currentUser={id:p.id,username:p.username,display_name:p.display_name,role:d.user?.role||p.role,token:d.token};document.getElementById('login-overlay').classList.remove('visible');showApp()}catch(e){err(e.message)}
}
function logout(){localStorage.removeItem('token');currentUser=null;location.reload()}
function showApp(){document.getElementById('app').classList.add('visible');renderSidebar();nav('dashboard');loadAll()}
function renderSidebar(){
  const btns=[{id:'dashboard',icon:'ًں“ٹ',label:'ظ„ظˆط­ط© ط§ظ„طھط­ظƒظ…'},{id:'members',icon:'ًں‘¥',label:'ط§ظ„ط£ط¹ط¶ط§ط،'},{id:'applications',icon:'ًں“‹',label:'ط§ظ„طھظ‚ط¯ظٹظ…ط§طھ'},{id:'warnings',icon:'âڑ ï¸ڈ',label:'ط§ظ„طھط­ط°ظٹط±ط§طھ'},{id:'leaves',icon:'ًںڈ–ï¸ڈ',label:'ط§ظ„ط¥ط¬ط§ط²ط§طھ'},{id:'tickets',icon:'ًںژ«',label:'ط§ظ„طھط°ط§ظƒط±'},{id:'ratings',icon:'â­گ',label:'ط§ظ„طھظ‚ظٹظٹظ…ط§طھ'},{id:'leaderboard',icon:'ًںڈ†',label:'ط§ظ„ظ…طھطµط¯ط±ظٹظ†'},{id:'logs',icon:'ًں“œ',label:'ط§ظ„ط³ط¬ظ„ط§طھ'},{id:'stats',icon:'ًں“ˆ',label:'ط§ظ„ط¥ط­طµط§ط¦ظٹط§طھ'},{id:'settings',icon:'âڑ™ï¸ڈ',label:'ط§ظ„ط¥ط¹ط¯ط§ط¯ط§طھ'}]
  document.getElementById('sidebar').innerHTML=`<div class="logo"><span>ًں›،ï¸ڈ ط¥ط¯ط§ط±ط© ط§ظ„ط³ظٹط±ظپط±</span></div>`+btns.map(b=>`<button class="side-btn" id="sb-${b.id}" onclick="nav('${b.id}')"><span class="icon">${b.icon}</span><span>${b.label}</span></button>`).join('')+`<div class="side-user"><strong>${currentUser.display_name||currentUser.username}</strong><br><span style="color:var(--purple)">${ROLES[currentUser.role]?.icon||''} ${currentUser.role}</span><br><button class="btn btn-sm btn-outline" onclick="logout()" style="margin-top:8px;width:100%">ط®ط±ظˆط¬</button></div>`

function renderMembers(c){
  const m=window._members||[]
  c.innerHTML=`<div class="page-title"><span class="emoji">ًں‘¥</span> ط§ظ„ط£ط¹ط¶ط§ط،</div><div class="form-card"><h3>â‍• ط¥ط¶ط§ظپط© ط¹ط¶ظˆ</h3><div class="row"><div class="field"><label>ط§ظ„ط§ط³ظ…</label><input id="m-name" placeholder="ط§ط³ظ… ط§ظ„ط¹ط¶ظˆ"></div><div class="field"><label>ط§ظ„ط±طھط¨ط©</label><select id="m-role">${ROLE_KEYS.map(r=>`<option value="${r}">${ROLES[r].icon} ${r}</option>`).join('')}</select></div><div class="field"><label>Discord Tag</label><input id="m-discord" placeholder="user#1234"></div></div><button class="btn btn-purple btn-sm" onclick="addMember()">ط¥ط¶ط§ظپط©</button></div><div class="form-card"><h3>ًں‘¥ ظ‚ط§ط¦ظ…ط© ط§ظ„ط£ط¹ط¶ط§ط، (${m.length})</h3>${m.length?`<table><thead><tr><th>ط§ظ„ط§ط³ظ…</th><th>ط§ظ„ط±طھط¨ط©</th><th>Discord</th><th>ظ†ظ‚ط§ط·</th><th>ط§ظ„طھظ‚ظٹظٹظ…</th><th>ط¥ط¬ط±ط§ط،ط§طھ</th></tr></thead><tbody>${m.map(x=>`<tr><td style="font-weight:700">${x.name}</td><td><span class="badge badge-purple">${ROLES[x.role]?.icon||''} ${x.role}</span></td><td style="color:var(--cyan)">${x.discord_tag||'â€”'}</td><td style="font-weight:700">${x.points||0}</td><td class="rating-cell" id="rc-${x.id}">â€”</td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-green btn-sm" onclick="updatePoints(${x.id},1)" title="+1">+1</button><button class="btn btn-red btn-sm" onclick="updatePoints(${x.id},-1)" title="-1">-1</button><button class="btn btn-outline btn-sm" onclick="openPoints(${x.id},'${x.name}')" title="ظ…ط®طµطµ">ًں”¢</button><button class="btn btn-outline btn-sm" onclick="showRatings(${x.id},'${x.name}')" title="ط§ظ„طھظ‚ظٹظٹظ…ط§طھ">â­گ</button><button class="btn btn-outline btn-sm" onclick="editNote(${x.id},'${x.name}','${(x.notes||'').replace(/'/g,"\\'")}')">ًں“‌</button><button class="btn btn-red btn-sm" onclick="deleteMember(${x.id},'${x.name}')">âœ•</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty-state">ظ„ط§ ظٹظˆط¬ط¯ ط£ط¹ط¶ط§ط،</div>'}</div>`

async function loadRating(id,elId){
  try{
    const r=await apiGet('/api/ratings/average/'+id)
    const el=document.getElementById(elId||('rc-'+id))
    if(el&&r.count){
